# Netlify build settings (https://docs.netlify.com/configure-builds/file-based-configuration/)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"
  # Public id of the Gradio Space with the backend (not a secret: it ends up in the built site).
  VITE_HF_SPACE = "Baragustay/policy-translator-api"

# Long cache for hashed build files; the page itself always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
