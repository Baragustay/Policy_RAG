<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Policy Translator</title>
    <meta name="description" content="Privacy policies and terms of popular apps, explained in plain language, with the original text one tap away." />
    <meta name="theme-color" content="#dfe3ed" />
    <!-- Squinty: SVG for modern browsers, PNG fallback (Safari), and the iOS home-screen icon.
         Not named favicon.* so browsers never reuse the old cached Vite icon. -->
    <link rel="icon" type="image/svg+xml" href="./squinty-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./squinty-icon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,100..151,400..1000&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Serif:opsz,wght@8..144,400;8..144,600&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('pt-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
